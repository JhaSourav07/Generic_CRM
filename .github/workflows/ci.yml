name: Vynexa CRM CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vynexa_crm_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/vynexa_crm_test?schema=public
      DATABASE_URL_TEST: postgresql://postgres:postgrespassword@localhost:5432/vynexa_crm_test?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Configure CI Environment File
        run: |
          cp .env.example .env
          sed -i 's|localhost:5433/vynexa_crm|localhost:5432/vynexa_crm_test|g' .env
          sed -i 's|postgres:postgres@|postgres:postgrespassword@|g' .env

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      - name: Validate Prisma Schema
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/vynexa_crm_test?schema=public
        run: npx prisma validate

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/vynexa_crm_test?schema=public
        run: npx prisma generate

      - name: Run Database Migrations (Isolated Test DB)
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/vynexa_crm_test?schema=public
        run: npx prisma migrate deploy

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Code Linter
        run: npm run lint

      - name: Execute Full Test Suite with Coverage Thresholds
        env:
          NODE_ENV: test
          PORT: 5001
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/vynexa_crm_test?schema=public
          DATABASE_URL_TEST: postgresql://postgres:postgrespassword@localhost:5432/vynexa_crm_test?schema=public
          AUTH_SECRET: vynexa-ci-test-secure-secret-key-32-chars-long
          ADMIN_EMAIL: admin@vynexa.com
          ADMIN_PASSWORD: super-secure-ci-admin-password
        run: npm run test:coverage

      - name: Production Build
        run: npm run build
