version: '3.8'

services:
  postgres:
    container_name: vynexa-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vynexa_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
